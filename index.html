<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucía Bermejo — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0a0d;
    --bg-raised: #131318;
    --bg-tile: #17171d;
    --line: #26262e;
    --text: #edece6;
    --text-dim: #8b8b95;
    --accent: #ffce2e;      /* purple-blue accent */
    --accent-dim: #8344f855;
    --wire: #51a9ec;        /* greenish turquoise */
    --radius: 2px;
  }

  *{ box-sizing: border-box; }

  html{ scroll-behavior: smooth; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  h1,h2,h3, .display{
    font-family: 'Space Grotesk', sans-serif;
    letter-spacing: -0.01em;
  }

  .mono{
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.02em;
  }

  a{ color: inherit; text-decoration: none; }

  /* ---------- layout shell ---------- */
  .wrap{
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 32px;
  }

  header{
    position: sticky;
    top: 0;
    z-index: 40;
    background: rgba(10,10,13,0.86);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  header .wrap{
    display:flex;
    align-items:center;
    justify-content:space-between;
    height: 68px;
  }
  .logo{
    font-size: 17px;
    font-weight: 600;
  }
  .logo .dot{ color: var(--accent); }

  nav a{
    font-size: 14px;
    color: var(--text-dim);
    margin-left: 28px;
    position: relative;
    padding-bottom: 4px;
  }
  nav a:hover, nav a.active{ color: var(--text); }
  nav a.active::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:1px;
    background: var(--accent);
  }

  main{ min-height: 70vh; }

  footer{
    border-top: 1px solid var(--line);
    padding: 28px 0 40px;
    color: var(--text-dim);
    font-size: 12px;
  }

  /* ---------- home / intro ---------- */
  .intro{
    padding: 64px 0 40px;
    max-width: 640px;
  }
  .intro .eyebrow{
    font-size: 12px;
    color: var(--wire);
    margin-bottom: 14px;
    display:block;
  }
  .intro p{
    font-size: 18px;
    line-height: 1.55;
    color: var(--text);
    margin: 0;
  }

  /* ---------- mosaic grid ---------- */
  .grid{
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-auto-rows: 90px;
    gap: 14px;
    padding-bottom: 90px;
  }

  .tile{
    position: relative;
    grid-column: var(--gc, span 3);
    grid-row: var(--gr, span 3);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--bg-tile);
    border: 1px solid var(--line);
    cursor: pointer;
    isolation: isolate;
  }

  .tile .media{
    position:absolute; inset:0;
    width:100%; height:100%;
    background-size: cover;
    background-position: center;
    object-fit: cover;
    filter: grayscale(0.85) contrast(1.05) brightness(0.75);
    transition: filter .5s ease, transform .6s ease;
  }
  .tile:hover .media{
    filter: grayscale(0) contrast(1) brightness(0.9);
    transform: scale(1.035);
  }

  .tile .scrim{
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(0,0,0,0.82) 100%);
  }

  /* HUD corner brackets — a nod to camera framing marks in a 3D viewport */
  .tile .hud-corner{
    position:absolute;
    width: 14px; height: 14px;
    border: 1.5px solid var(--accent);
    opacity: 0;
    transition: opacity .3s ease, transform .3s ease;
    z-index: 3;
  }
  .tile:hover .hud-corner{ opacity: 1; }
  .tile .hud-corner.tl{ top:10px; left:10px; border-right:none; border-bottom:none; }
  .tile .hud-corner.tr{ top:10px; right:10px; border-left:none; border-bottom:none; }
  .tile .hud-corner.bl{ bottom:10px; left:10px; border-right:none; border-top:none; }
  .tile .hud-corner.br{ bottom:10px; right:10px; border-left:none; border-top:none; }

  .tile .index{
    position:absolute;
    top:12px; left:12px;
    font-size: 11px;
    color: var(--text-dim);
    z-index: 2;
  }
  .tile:hover .index{ color: var(--wire); }

  .tile .info{
    position:absolute;
    left:16px; right:16px; bottom:14px;
    z-index: 2;
  }
  .tile .cat{
    display:block;
    font-size: 10px;
    color: var(--wire);
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .tile .title{
    font-size: 17px;
    font-weight: 600;
    line-height:1.25;
    margin: 0 0 4px;
  }
  .tile .cap{
    font-size: 12.5px;
    color: var(--text-dim);
    max-width: 92%;
    opacity: 0;
    max-height: 0;
    transition: opacity .3s ease, max-height .3s ease;
  }
  .tile:hover .cap{ opacity: 1; max-height: 60px; }

  @media (max-width: 860px){
    .grid{ grid-template-columns: repeat(2, 1fr); grid-auto-rows: 110px; }
    .tile{ grid-column: span 2; grid-row: span 2; }
  }

  /* ---------- project detail ---------- */
  .detail-hero{
    padding: 56px 0 32px;
    border-bottom: 1px solid var(--line);
  }
  .back{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 26px;
  }
  .back:hover{ color: var(--accent); }
  .detail-hero .cat{
    font-size: 12px;
    color: var(--wire);
    text-transform: uppercase;
    display:block;
    margin-bottom: 10px;
  }
  .detail-hero h1{
    font-size: clamp(28px, 4vw, 44px);
    margin: 0 0 18px;
    max-width: 820px;
    line-height: 1.15;
  }
  .detail-hero .role{
    font-size: 14px;
    color: var(--text-dim);
    display:flex;
    gap: 22px;
    flex-wrap: wrap;
  }
  .detail-hero .role b{ color: var(--text); font-weight:500; }

  .detail-media{
    margin: 36px 0;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow:hidden;
    aspect-ratio: 16/9;
    position:relative;
    background: var(--bg-tile);
  }
  .detail-media .media{
    position:absolute; inset:0;
    background-size: cover;
    background-position: center;
  }
  .detail-media video{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit: cover;
  }

  .section{
    padding: 40px 0;
    border-bottom: 1px solid var(--line);
  }
  .section:last-of-type{ border-bottom:none; }
  .section .num{
    font-size: 12px;
    color: var(--accent);
    margin-bottom: 10px;
    display:block;
  }
  .section h2{
    font-size: 24px;
    margin: 0 0 18px;
  }
  .section .body{
    color: var(--text-dim);
    font-size: 15.5px;
    line-height: 1.7;
    max-width: 700px;
  }
  .shot-row{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin-top: 24px;
  }
  .shot-row .shot{
    aspect-ratio: 4/3;
    background: var(--bg-tile);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background-size: cover;
    background-position:center;
  }
  .shot-row.full .shot{ grid-column: 1 / -1; aspect-ratio: 16/9; }

  @media (max-width: 700px){
    .shot-row{ grid-template-columns: 1fr; }
  }

  /* ---------- project blocks (text / media layouts) ---------- */
  .blk{
    display:grid;
    grid-template-columns: minmax(0,5fr) minmax(0,7fr);
    gap: 56px;
    align-items:start;
    padding: 48px 0;
    border-bottom: 1px solid var(--line);
  }
  .blk.flip{ grid-template-columns: minmax(0,7fr) minmax(0,5fr); }
  .blk.flip .blk-media{ order:-1; }
  .blk.full{ display:block; }
  .blk.full .blk-media{ margin-top: 28px; }
  .blk.sub{ padding-top: 36px; }
  .blk.nomedia .body{ max-width: none; }
  .blk.sub h2{ font-size: 20px; }
  .blk-text{ position:sticky; top: 92px; }
  .blk.full .blk-text{ position:static; }
  .blk .num{ font-size:12px; color:var(--accent); margin-bottom:10px; display:block; }
  .blk h2{ font-size:24px; margin:0 0 16px; }
  .blk .body{ color:var(--text-dim); font-size:14px; line-height:1.7; margin:0 0 14px; max-width:700px; }
  .blk .body b{ color:var(--text); font-weight:500; }
  .blk-text .mset{ margin-top: 22px; }

  .mset{ display:flex; gap:14px; align-items:flex-start; }
  .mset.stack{ flex-direction:column; align-items:stretch; }
  .mset.mgrid{ display:grid; grid-template-columns: repeat(var(--cols,2), minmax(0,1fr)); }
  .mi{ margin:0; min-width:0; }
  .mset.stack .mi{ width:100%; }
  .frame{
    position:relative; width:100%;
    background: var(--bg-tile);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow:hidden;
  }
  .frame img, .frame video, .frame iframe{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit: cover; border:0;
  }
  .mi figcaption{ font-size:11px; color:var(--text-dim); margin-top:8px; }
  .ph{
    position:absolute; inset:0; display:grid; place-items:center;
    text-align:center; padding:10px; font-size:11px;
    color: var(--text-dim); border:1px dashed var(--line);
  }

  @media (max-width: 860px){
    .blk, .blk.flip{ grid-template-columns: 1fr; gap: 28px; }
    .blk.flip .blk-media{ order:0; }
    .blk-text{ position:static; }
    .mset.mgrid{ grid-template-columns: repeat(2, minmax(0,1fr)) !important; }
  }
  .blk .body a, .about-more a{ color:var(--accent); text-decoration:underline; text-underline-offset:3px; }
  .about-more{ margin-top:24px; font-size:14px; color:var(--text-dim); line-height:1.7; }
  .intro .about-more p{ margin:0 0 16px; font-size:14px; color:var(--text-dim); line-height:1.7; }
  .intro .about-more .links{ font-size:13px; margin-top:24px; }
  .about-more .tools{ font-size:12.5px; line-height:2; }
  .about-more .tools b{ color:var(--wire); font-weight:500; margin-right:12px; }
  .links a, .foot-links a{ color:var(--text-dim); text-decoration:none; margin-right:20px; }
  .links a:hover, .foot-links a:hover{ color:var(--accent); }
  .foot{ display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; }
  .foot-links a{ margin:0 0 0 20px; }
</style>
</head>

}

function mediaEl(m){
  const r = m.ratio || "16/9";
  const [w,h] = r.split("/").map(Number);
  let inner = null;
  if(m.type==="img" && m.src) inner = `<img src="${m.src}" alt="${m.cap||""}" loading="lazy">`;
  if(m.type==="loop" && m.src) inner = `<video src="${m.src}" muted loop autoplay playsinline preload="auto"></video>`;
  /* Aquí le quité la propiedad 'muted' a los videos normales para que suenen */
  if(m.type==="video" && m.src) inner = `<video src="${m.src}" controls playsinline preload="metadata"></video>`;
  if(m.type==="youtube" && m.id) inner = `<iframe src="https://www.youtube-nocookie.com/embed/${m.id}${m.start ? `?start=${m.start}` : ""}" title="${m.cap||"Video"}" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  if(m.type==="spotify" && m.id) inner = `<iframe src="https://open.spotify.com/embed/track/${m.id}?utm_source=generator&theme=0" title="Spotify" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>`;
  if(m.type==="instagram" && m.id) inner = `<iframe src="https://www.instagram.com/${m.kind||"reel"}/${m.id}/embed" title="Instagram" loading="lazy" scrolling="no" allowfullscreen></iframe>`;
  if(!inner) inner = `<div class="ph mono">${m.hint || m.type}</div>`;
  const fs = m.type==="spotify" ? "height:152px" : `aspect-ratio:${r}`;
  const span = m.span ? `grid-column:span ${m.span};` : "";
  return `<figure class="mi" style="flex:${(w/h).toFixed(3)} 1 0; ${span}${m.maxw ? `max-width:${m.maxw};` : ""}${m.mt ? `margin-top:${m.mt};` : ""}"><div class="frame" style="${fs}">${inner}</div>${m.cap ? `<figcaption class="mono">${m.cap}</figcaption>` : ""}</figure>`;
}

function mset(items, layout="stack", cols=2){
  return `<div class="mset ${layout === "grid" ? "mgrid" : layout}" style="--cols:${cols}">${items.map(mediaEl).join("")}</div>`;
}

function renderBlock(b){
  const paras = (b.text||[]).map(t => `<p class="body">${t}</p>`).join("");
  const after = b.after ? mset(b.after) : "";
  const media = b.media ? `<div class="blk-media">${mset(b.media, b.mediaLayout, b.cols)}</div>` : "";
  const cls = [b.layout || "split", b.flip ? "flip" : "", b.sub ? "sub" : "", !b.media && !b.layout ? "full" : "", !b.media ? "nomedia" : ""].join(" ");
  return `<section class="blk ${cls}">
    <div class="blk-text"><span class="num mono">${b.num}</span><h2>${b.heading}</h2>${paras}${after}</div>${media}
  </section>`;
}

function renderProject(slug){
  const p = PROJECTS.find(x => x.slug === slug);
  if(!p) return `<div class="wrap"><p style="padding:60px 0;">Project not found.</p></div>`;

  const roleRow = p.role.map(([k,v]) => `<span>${k} — <b>${v}</b></span>`).join("");

  const sections = (p.blocks ? p.blocks.map(renderBlock) : (p.sections||[]).map(s => `
    <div class="section">
      <span class="num mono">${s.num}</span>
      <h2>${s.heading}</h2>
      <p class="body">${s.body}</p>
      ${s.shots && s.shots.length ? `
        <div class="shot-row ${s.full ? "full" : ""}">
          ${s.shots.map(src => `<div class="shot" style="background-image:url('${src}')"></div>`).join("")}
        </div>` : ""}
    </div>
  `)).join("");

  return `
    <div class="detail-hero">
      <div class="wrap">
        <a class="back mono" href="#/">← back</a>
        <span class="cat mono">${p.cat}</span>
        <h1>${p.title}</h1>
        <div class="role mono">${roleRow}</div>
      </div>
    </div>
    <div class="wrap">
      ${p.blocks ? "" : `<div class="detail-media">
        ${p.video
          ? `<video src="${p.video}" ${p.heroImg ? `poster="${p.heroImg}"` : ""} controls muted loop playsinline preload="metadata"></video>`
          : `<div class="media" style="background-image:url('${p.heroImg}')"></div>`
        }
      </div>`}
      ${sections}
    </div>
  `;
}

/* ---------------- router ---------------- */
function route(){
  const hash = location.hash || "#/";
  const app = document.getElementById("app");
  document.getElementById("nav-work").classList.toggle("active", hash === "#/" || hash.startsWith("#/project"));
  document.getElementById("nav-about").classList.toggle("active", hash === "#/about");

  if(hash === "#/about"){
    app.innerHTML = `<div class="wrap">${renderAbout()}</div>`;
  } else if(hash.startsWith("#/project/")){
    const slug = hash.replace("#/project/","");
    app.innerHTML = renderProject(slug);
  } else {
    app.innerHTML = `<div class="wrap">${renderHome()}</div>`;
  }
  window.scrollTo(0,0);
}

document.getElementById("foot-links").innerHTML = LINKS;
window.addEventListener("hashchange", route);
window.addEventListener("DOMContentLoaded", route);
</script>
